# AirClass: 관리자 웹(/) + 사용자 앱 웹 빌드(/app/) + API 서버(/api/)

# AirChat 호출 속도 제한 (Claude API 비용 보호)
# Funnel/Tunnel 뒤에서는 모든 요청이 같은 주소로 들어오므로 사실상 "서비스 전체" 한도로 동작한다.
limit_req_zone $binary_remote_addr zone=airchat:1m rate=20r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Funnel/Cloudflare(HTTPS) 뒤에서 리다이렉트가 http://…:80 으로 새지 않게 상대 경로로 보냄
  absolute_redirect off;

  # 압축으로 휴대폰 첫 로딩을 빠르게
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker 내부 DNS: api 컨테이너가 아직 없거나 재시작 중이어도 nginx는 정상 기동하게
  resolver 127.0.0.11 valid=10s ipv6=off;

  # API 상태 확인은 비용이 들지 않으니 속도 제한 없이
  location = /api/health {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
  }

  # API 서버 (server/, api 컨테이너)
  location /api/ {
    limit_req zone=airchat burst=10 nodelay;   # 분당 20회 + 순간 10회까지
    limit_req_status 429;
    client_max_body_size 32k;

    set $api_upstream http://api:3000;         # 변수로 두면 요청 때마다 이름을 다시 찾음
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;                    # LLM 응답 대기 (서버 쪽 제한은 25초)
  }

  # 빌드 결과물의 해시가 붙은 파일은 오래 캐시 (내용이 바뀌면 파일 이름도 바뀜)
  location ~* ^/(assets|app/_expo|app/assets)/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # 사용자 앱: /app/control 같은 주소를 새로고침해도 앱이 열리게
  location = /app { return 301 /app/; }
  location /app/ {
    try_files $uri $uri/ /app/index.html;
  }

  # 관리자 웹: /devices 같은 주소를 새로고침해도 React 라우터가 처리하게
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html은 캐시하지 않아야 배포 후 바로 새 버전이 보임
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /app/index.html { add_header Cache-Control "no-cache"; }
}
