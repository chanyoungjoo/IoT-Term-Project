# AirClass: 관리자 웹(/) + 사용자 앱 웹 빌드(/app/)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Funnel/Cloudflare(HTTPS) 뒤에서 리다이렉트가 http://…:80 으로 새지 않게 상대 경로로 보냄
  absolute_redirect off;

  # 압축으로 휴대폰 첫 로딩을 빠르게
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # 빌드 결과물의 해시가 붙은 파일은 오래 캐시 (내용이 바뀌면 파일 이름도 바뀜)
  location ~* ^/(assets|app/_expo|app/assets)/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # 사용자 앱: /app/control 같은 주소를 새로고침해도 앱이 열리게
  location = /app { return 301 /app/; }
  location /app/ {
    try_files $uri $uri/ /app/index.html;
  }

  # 관리자 웹: /devices 같은 주소를 새로고침해도 React 라우터가 처리하게
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html은 캐시하지 않아야 배포 후 바로 새 버전이 보임
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /app/index.html { add_header Cache-Control "no-cache"; }
}
